<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050605">
  <meta name="robots" content="noindex">
  <title>Swing Quest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 22 L12 10 L18 18 L28 6' stroke='%2344d62c' stroke-width='4' fill='none' stroke-linecap='square'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="mark" href="#command" aria-label="Swing Quest home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 23 L11 11 L17 18 L29 5" stroke="#44d62c" stroke-width="3.5" fill="none" stroke-linecap="square"/>
          <path d="M22 5 H29 V12" stroke="#44d62c" stroke-width="3.5" fill="none" stroke-linecap="square"/></svg>
        <b>Swing<span>Quest</span></b>
      </a>
      <div class="status" id="status"></div>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
        <input id="search" type="search" placeholder="Search any stock" autocomplete="off" aria-label="Search stocks">
        <kbd>/</kbd>
        <div class="results" id="results" hidden></div>
      </div>
      <div class="player" id="player"></div>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#command" data-tab="command">Command</a>
      <a href="#scanner" data-tab="scanner">Scanner</a>
      <a href="#holdings" data-tab="holdings">Holdings</a>
      <a href="#record" data-tab="record">Record</a>
      <a href="#system" data-tab="system">System</a>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <div class="drawer-bg" id="drawer-bg" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Stock dossier" aria-hidden="true"></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <footer class="footer">Not financial advice. Data: SEC EDGAR (insider filings), Yahoo Finance (prices, analysts, fundamentals). Your holdings never leave this browser.</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
