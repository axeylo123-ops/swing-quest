<html lang="en">
<head>

  <meta name="robots" content="noindex">
  <title>Swing Quest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,3 61,32 32,61 3,32' fill='%23e2b13c' stroke='%238a5a08' stroke-width='3'/%3E%3Cpolygon points='32,3 61,32 46,32' fill='%23fff' opacity='.35'/%3E%3C/svg%3E">

    <a href="#today" data-tab="today" title="Today's picks">
      <svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 4v2h10V7zm0 4v2h10v-2zm0 4v2h6v-2z"/></svg><span>Quest Board</span></a>
    <a href="#scorecard" data-tab="scorecard" title="Track record: is it working?">
      <svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2 12 2 12s4.5 7 10 7 10-7 10-7-4.5-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-2.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg><span>Chronicle</span></a>

    <a href="#portfolio" data-tab="portfolio" title="Your holdings vs signals">

    <a href="#quests" data-tab="quests" title="Your level, streak and badges">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.3 3.4 10.2 8 11.5 4.6-1.3 8-6.2 8-11.5V5z"/></svg><span>Hero</span></a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <footer class="footer">
    <strong>Not financial advice.</strong> An educational project. Data: SEC EDGAR insider filings, Yahoo Finance prices.
  </footer>

  <script type="module" src="js/app.js"></script>
