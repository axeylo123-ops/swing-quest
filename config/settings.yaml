# Universe rules: which stocks are allowed at all.
universe:
  min_price: 2.0                  # skip penny stocks (raise for safety, lower for more ideas)
  max_price: null                 # optional ceiling, e.g. 30 (null = no limit)
  min_avg_dollar_volume: 10000000 # $10M/day average (price x volume, 20-day)

# Where prices come from. Swap for a paid API later by adding a new source.
prices:
  source: yfinance

# Polite SEC access. SEC limit is 10/sec; we stay well under it.
sec:
  max_requests_per_second: 5

# Trade plan rules.
trade:
  atr_period: 14
  stop_atr_multiple: 2.0
  min_reward_risk: 2.0
  time_stop_days: 15
