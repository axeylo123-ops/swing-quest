# Swing Quest scoring weights. YOU own this file.
# 2026-10-18: applied the Reckoning's tested suggestion (relative strength now counts a little).
# The weekly System Health report may suggest changes in
# weights_proposed.yaml, but nothing here changes unless you edit it.
#
# Each factor earns between 0% and 100% of its weight.
# Weights must add up to 100, so the score runs from 0 to 100.

weights:
  cluster: 27          # several different insiders buying within 30 days
  role: 17             # CEO/CFO > Director > other officers > 10% owners
  dollar_size: 13      # total $ bought in the 30-day window
  stake_increase: 13   # how much the buy grew their existing holding
  first_buy: 13        # first purchase by that insider in 12+ months
  price_context: 13    # near the 52-week low = more points
  relative_strength: 4 # stock beating the market (SPY) over 3 months (counts since 2026-10-18)
  # Observed only (weight 0): shown as context on each quest and judged by the
  # weekly Reckoning. Give it weight here if the Reckoning shows it helps.
  sector_strength: 0   # its sector fund beating the market over 3 months

# ---------------------------------------------------------------------------
# THE BRAIN (whole-market stock picking). Each pillar is a 0-100 score; the
# weights below blend them into one Conviction score. Refine as we learn.
pillars:
  upside: 25       # analyst target vs price, room to the 52-week high
  analysts: 15     # consensus rating, coverage, estimate revisions, earnings beats
  insiders: 15     # genuine open-market insider buying (50 = none, not negative)
  quality: 15      # margins, return on equity, debt, growth, cash flow
  momentum: 15     # beating the market, trend above 50/200-day averages
  value: 10        # forward P/E and price/sales vs its own sector
risk_max_penalty: 15   # subtracted for volatility, tiny size, heavy debt, earnings in window...
canada_bonus: 3        # small tie-breaker for Canadian listings, never decisive
ideas:
  top_n: 3             # top ideas shown first
  watch_n: 12          # next best, to watch
  min_conviction: 58   # 'Buy candidate' needs at least this Conviction; below = Neutral
  min_upside: 0.08     # analyst upside or swing target of at least 8%
  min_quality: 25      # skip weak businesses
  max_penalty: 9       # skip the riskiest
  max_daily_move: 0.06 # skip stocks that move more than 6% a day on average (stops too wide)
  min_dollar_volume_us: 10000000
  min_dollar_volume_ca: 3000000

# How much of the weight each role earns.
role_points:
  CEO: 1.0
  CFO: 1.0
  Director: 0.7
  Officer: 0.5
  "10% Owner": 0.5
  Other: 0.2

rules:
  window_days: 30            # look-back window for insider buys
  trigger_days: 5            # a NEW buy must be filed within this many calendar days
  min_score: 65              # minimum score to be a quest (~5/month; 55-64 show on the radar instead)
  quests_per_month: 5        # goal: high-quality picks worth checking daily (~1 a week + the nightly radar list)
  ignore_10b5_1_plans: true  # pre-scheduled plan buys say little about conviction
